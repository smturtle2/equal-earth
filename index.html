<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="https://smturtle2.github.io/equal-earth/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="https://smturtle2.github.io/equal-earth/" />
    <meta property="og:image" content="https://smturtle2.github.io/equal-earth/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://smturtle2.github.io/equal-earth/og-image.png" />
    <title>Equal Earth</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="map" tabindex="0" role="img" aria-label="{{mapLabel}}" aria-busy="true"></canvas>
    <canvas id="map-labels" aria-hidden="true"></canvas>
    <span id="location-marker" aria-hidden="true" hidden></span>
    <div id="navigation-controls" role="group" aria-label="{{navigation}}">
      <div id="coordinate-control" data-editing="false">
        <button id="coordinates" type="button" aria-label="{{coordinates}}" aria-describedby="coordinate-value" aria-controls="coordinate-form" aria-expanded="false" disabled>
          <span id="coordinate-value">—</span>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>
        </button>
        <form id="coordinate-form" aria-label="{{coordinates}}" novalidate hidden>
          <input id="coordinate-input" name="coordinates" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-label="{{coordinateInput}}" placeholder="{{coordinateInput}}" aria-describedby="coordinate-error" disabled />
          <button id="coordinate-go" type="submit" disabled>{{coordinateGo}}</button>
          <button id="coordinate-cancel" type="button" aria-label="{{coordinateCancel}}" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
          <span id="coordinate-error" class="coordinate-error" aria-live="polite" hidden></span>
        </form>
      </div>
      <button id="locate" type="button" aria-label="{{locate}}" aria-busy="false" disabled>
        <svg class="location-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
        <span class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <div id="view-presets" role="group" aria-label="{{presets}}">
        <button id="preset" type="button" aria-label="{{presets}}" aria-haspopup="menu" aria-controls="preset-menu" aria-expanded="false" popovertarget="preset-menu" disabled>
          <span id="preset-label"></span>
          <svg class="select-chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <div id="preset-menu" role="menu" aria-label="{{presets}}" popover></div>
      </div>
      <span id="location-status" role="status"></span>
    </div>
    <div id="map-controls">
      <div id="texture-control" role="group" aria-label="{{texture}}" aria-busy="true">
        <button id="texture" type="button" aria-label="{{texture}}" aria-haspopup="menu" aria-controls="texture-menu" aria-expanded="false" popovertarget="texture-menu" disabled>
          <span id="texture-label"></span>
          <svg class="select-chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
          <span id="texture-loading" class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div id="texture-menu" role="menu" aria-label="{{textureMenu}}" popover></div>
      </div>
      <button id="map-details" type="button" aria-label="{{layers}}" aria-pressed="false" aria-busy="false" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
      </button>
      <button id="download" type="button" aria-label="{{download}}" aria-busy="false" disabled>
        <svg class="download-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>
        <span id="download-loading" class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <div id="control-statuses">
        <span id="texture-status" role="status"></span>
        <span id="download-status" role="status"></span>
        <span id="layer-status" role="status"></span>
      </div>
    </div>
    <aside id="help-panel" role="note" aria-label="{{controls}}">
      <div id="help-mouse"></div>
      <div id="help-touch"></div>
    </aside>
    <section id="globe-panel" aria-label="{{globe}}">
      <div class="globe-heading">
        <button id="globe-layers-button" type="button" aria-label="{{globeLayers}}" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
        </button>
      </div>
      <canvas id="globe" tabindex="0" role="img" aria-label="{{globeGrid}}" aria-busy="true" data-layer="graticule"></canvas>
    </section>
    <p id="message" role="status" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
